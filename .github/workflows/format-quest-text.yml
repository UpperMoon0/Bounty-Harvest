name: Format quest text

on:
  push:
    branches:
      - codex/levels-1-15-hayday-overhaul

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/levels-1-15-hayday-overhaul
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalize quest text
        run: python tools/format_quest_text.py --write
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Quest text already formatted."
            exit 0
          fi
          git config user.name "Lily"
          git config user.email "lily@users.noreply.github.com"
          git add config/ftbquests/quests
          git commit -m "fix: format quest text for readability"
          git push origin HEAD:codex/levels-1-15-hayday-overhaul
