name: Validate pack

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate quest text formatting
        run: python tools/format_quest_text.py
      - name: Validate quest graph
        run: python tools/validate_quests.py
      - name: Validate quest descriptions
        run: python tools/validate_descriptions.py
      - name: Validate progression, metadata, and runtime content
        run: python tools/validate_pack.py
      - name: Validate automation economy curve
        run: python tools/validate_economy_curve.py
      - name: Validate retained bounty infrastructure
        run: python tools/validate_bounty_infrastructure.py
      - name: Validate CurseForge publisher modes
        shell: pwsh
        run: |
          ./tools/publish_curseforge.ps1 -DryRun -Mode client
          ./tools/publish_curseforge.ps1 -DryRun -Mode server
