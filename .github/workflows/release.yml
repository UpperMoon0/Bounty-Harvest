name: Release modpack

on:
  push:
    branches: [main]
    paths:
      - 'pack/pack.json'
      - '.github/workflows/release.yml'
      - 'tools/publish_curseforge.ps1'
      - 'tools/curseforge_upload.py'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_type:
        description: CurseForge release channel
        required: true
        default: beta
        type: choice
        options: [alpha, beta, release]
      publish:
        description: Publish GitHub and CurseForge releases
        required: true
        default: false
        type: boolean

concurrency:
  group: release-modpack
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      release_type: ${{ steps.check.outputs.release_type }}
      publish_github_release: ${{ steps.check.outputs.publish_github_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release trigger
        id: check
        shell: pwsh
        env:
          BEFORE: ${{ github.event.before }}
          MANUAL_PUBLISH: ${{ inputs.publish || false }}
          REQUESTED_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pack = Get-Content pack/pack.json -Raw | ConvertFrom-Json
          $version = [string]$pack.version
          $releaseType = [string]$pack.releaseType
          $shouldRelease = $false
          $publishGithubRelease = $false

          $releaseTag = "v$version"
          $tagExists = -not [string]::IsNullOrWhiteSpace(((& git tag --list $releaseTag) -join "`n"))
          if ($LASTEXITCODE -ne 0) { throw "Failed to inspect release tags." }

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if (-not [string]::IsNullOrWhiteSpace($env:REQUESTED_RELEASE_TYPE)) { $releaseType = $env:REQUESTED_RELEASE_TYPE }
            $shouldRelease = ($env:GITHUB_REF -eq 'refs/heads/main') -and ($env:MANUAL_PUBLISH -eq 'true')
            $publishGithubRelease = $shouldRelease -and (-not $tagExists)
          }
          elseif ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF.Substring('refs/tags/'.Length)
            if ($tag -ne $releaseTag) { throw "Tag $tag does not match pack version $releaseTag." }
            $shouldRelease = $true
            # A tag push is the event that creates the GitHub release, so the
            # tag necessarily exists even when the release object does not yet.
            $publishGithubRelease = $true
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            $before = $env:BEFORE
            $previousVersion = $null
            $hasPreviousPack = $false
            $releaseInfrastructureChanged = $false

            if ($before -and $before -ne '0000000000000000000000000000000000000000') {
              # Probe the tree first instead of intentionally running a failing
              # `git show` when legacy main does not have pack/pack.json.
              $previousPath = ((& git ls-tree -r --name-only $before -- pack/pack.json) -join "`n").Trim()
              if ($LASTEXITCODE -ne 0) { throw "Failed to inspect previous commit $before." }

              if ($previousPath -eq 'pack/pack.json') {
                $previousJson = (& git show "${before}:pack/pack.json") -join "`n"
                if ($LASTEXITCODE -ne 0) { throw "Failed to read pack/pack.json from previous commit $before." }
                $previousVersion = [string](($previousJson | ConvertFrom-Json).version)
                $hasPreviousPack = $true
              }

              $changedPaths = @(& git diff --name-only $before $env:GITHUB_SHA)
              if ($LASTEXITCODE -ne 0) { throw "Failed to inspect changed paths since $before." }
              $releaseInfrastructureChanged =
                ($changedPaths -contains '.github/workflows/release.yml') -or
                ($changedPaths -contains 'tools/publish_curseforge.ps1') -or
                ($changedPaths -contains 'tools/curseforge_upload.py')
            }

            # A missing release tag means the current version was never fully
            # published. Release-pipeline fixes are also explicit retries: a
            # prior run may have created the GitHub tag/release before the
            # CurseForge leg failed, so tag existence alone is not sufficient.
            $shouldRelease =
              (-not $hasPreviousPack) -or
              ($previousVersion -ne $version) -or
              (-not $tagExists) -or
              $releaseInfrastructureChanged
            $publishGithubRelease = $shouldRelease -and (-not $tagExists)
          }

          if ($shouldRelease -and -not (Test-Path "changelog/$version.md")) {
            throw "Missing changelog/$version.md."
          }
          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_type=$releaseType" >> $env:GITHUB_OUTPUT
          "publish_github_release=$($publishGithubRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  build:
    needs: release-gate
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate progression and metadata
        run: |
          python tools/validate_quests.py
          python tools/validate_pack.py
      - name: Build archives
        shell: pwsh
        run: ./tools/build_modpack.ps1 -Version '${{ needs.release-gate.outputs.version }}'
      - name: Verify archive contents and client/server split
        run: python tools/verify_archives.py
      - name: Boot dedicated server
        shell: pwsh
        run: ./tools/smoke_test_server.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Bounty-Harvest-${{ needs.release-gate.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

  curseforge-preflight:
    if: needs.release-gate.outputs.should_release == 'true'
    needs: [release-gate, build]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Bounty-Harvest-${{ needs.release-gate.outputs.version }}
          path: dist
      - name: CurseForge preflight
        shell: pwsh
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: ./tools/publish_curseforge.ps1 -Version '${{ needs.release-gate.outputs.version }}' -ReleaseType '${{ needs.release-gate.outputs.release_type }}' -SkipBuild -Preflight

  publish-curseforge-client:
    if: needs.release-gate.outputs.should_release == 'true'
    needs: [release-gate, build, curseforge-preflight]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Bounty-Harvest-${{ needs.release-gate.outputs.version }}
          path: dist
      - name: Publish CurseForge client file
        shell: pwsh
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_CORE_API_KEY: ${{ secrets.CURSEFORGE_CORE_API_KEY }}
        run: ./tools/publish_curseforge.ps1 -Version '${{ needs.release-gate.outputs.version }}' -ReleaseType '${{ needs.release-gate.outputs.release_type }}' -SkipBuild -Mode client -StateFile 'dist/curseforge-state.json'
      - name: Persist CurseForge client file ID
        uses: actions/upload-artifact@v4
        with:
          name: Bounty-Harvest-${{ needs.release-gate.outputs.version }}-curseforge-state
          path: dist/curseforge-state.json
          if-no-files-found: error
          retention-days: 7

  publish-curseforge-server:
    if: needs.release-gate.outputs.should_release == 'true'
    needs: [release-gate, build, curseforge-preflight, publish-curseforge-client]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Bounty-Harvest-${{ needs.release-gate.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Bounty-Harvest-${{ needs.release-gate.outputs.version }}-curseforge-state
          path: dist
      - name: Publish CurseForge server child file
        shell: pwsh
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_CORE_API_KEY: ${{ secrets.CURSEFORGE_CORE_API_KEY }}
        run: ./tools/publish_curseforge.ps1 -Version '${{ needs.release-gate.outputs.version }}' -ReleaseType '${{ needs.release-gate.outputs.release_type }}' -SkipBuild -Mode server -StateFile 'dist/curseforge-state.json'

  publish-github-release:
    if: needs.release-gate.outputs.publish_github_release == 'true'
    needs: [release-gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Bounty-Harvest-${{ needs.release-gate.outputs.version }}
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release-gate.outputs.version }}
          name: Bounty Harvest v${{ needs.release-gate.outputs.version }}
          body_path: changelog/${{ needs.release-gate.outputs.version }}.md
          fail_on_unmatched_files: true
          files: dist/*.zip
          draft: false
          prerelease: ${{ needs.release-gate.outputs.release_type != 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
