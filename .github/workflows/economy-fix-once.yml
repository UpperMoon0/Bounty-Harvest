name: One-shot late economy corrections

on:
  push:
    paths:
      - '.github/workflows/economy-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply late promotion and validator corrections
        shell: python
        run: |
          from pathlib import Path

          costs = {19: (48, 384), 20: (96, 768), 21: (192, 1536), 22: (384, 3072), 23: (768, 6144)}
          root = Path('.')
          for level, (old, new) in costs.items():
              path = root / 'config' / 'ftbquests' / 'quests' / 'chapters' / f'level_{level}.snbt'
              text = path.read_text(encoding='utf-8')
              old_line = f'consume_items: true, count: {old}L'
              new_line = f'consume_items: true, count: {new}L'
              if old_line not in text:
                  raise SystemExit(f'Expected promotion cost not found in {path}: {old_line}')
              text = text.replace(old_line, new_line, 1)
              path.write_text(text, encoding='utf-8')

          path = root / 'tools' / 'validate_economy_curve.py'
          text = path.read_text(encoding='utf-8')
          old = '''    if not re.search(r"content:\\s*'ends_delight:chorus_fruit_pie'[\\s\\S]{0,120}amount:\\s*bulk\\(23,", bounty):
              errors.append("Level 23 repeatable orders no longer put chorus pies under 1024x renewable pressure")
          if re.search(r"content:\\s*'twilightdelight:glowstew'[\\s\\S]{0,120}amount:\\s*bulk\\(22,", bounty):
              errors.append("new Twilight frontier input Glowstew should stay fixed-volume instead of inheriting the 512x legacy multiplier")
          '''
          new = '''    if not re.search(r"^\\s*chorus_pie:.*content:\\s*'ends_delight:chorus_fruit_pie'.*amount:\\s*bulk\\(23,", bounty, re.MULTILINE):
              errors.append("Level 23 repeatable orders no longer put chorus pies under 1024x renewable pressure")
          if re.search(r"^\\s*glowstew:.*amount:\\s*bulk\\(22,", bounty, re.MULTILINE):
              errors.append("new Twilight frontier input Glowstew should stay fixed-volume instead of inheriting the 512x legacy multiplier")
          '''
          if old not in text:
              raise SystemExit('Expected frontier bounty validator block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name 'Lily'
          git config user.email 'lily@users.noreply.github.com'
          git add config/ftbquests/quests/chapters/level_{19,20,21,22,23}.snbt tools/validate_economy_curve.py
          git commit -m 'fix: preserve exponential late progression costs'
          git push origin HEAD:${{ github.ref_name }}
