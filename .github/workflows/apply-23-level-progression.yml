name: Apply 23-level progression

on:
  push:
    branches:
      - codex/levels-1-15-hayday-overhaul

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/levels-1-15-hayday-overhaul
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect generator write loop
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path
          wrapper = Path('tools/restructure_progression_23.py').read_text(encoding='utf-8')
          payload = re.search(r'b64decode\(\"([^\"]+)\"\)', wrapper).group(1)
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          lines = source.splitlines()
          for number in range(1695, 1765):
              if number <= len(lines):
                  print(f'{number}: {lines[number-1]}')
          PY
