name: Apply 23-level progression

on:
  push:
    branches:
      - codex/levels-1-15-hayday-overhaul

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/levels-1-15-hayday-overhaul
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose generator output path
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path
          wrapper = Path('tools/restructure_progression_23.py').read_text(encoding='utf-8')
          payload = re.search(r'b64decode\(\"([^\"]+)\"\)', wrapper).group(1)
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          lines = source.splitlines()
          for number, line in enumerate(lines, 1):
              if number <= 130 or 'ROOT' in line or 'CHAPTERS' in line:
                  print(f'{number}: {line}')
          source = source.replace(
              '"icon": old_icons.get(level, LEVELS[level]["icon"]),',
              '"icon": old_icons[level] if level in old_icons else LEVELS[level]["icon"],'
          )
          ns = {'__name__': 'migration_probe'}
          exec(compile(source, 'restructure_progression_23.py', 'exec'), ns)
          print('ROOT =', ns.get('ROOT'))
          print('CHAPTERS =', ns.get('CHAPTERS'))
          print('LEVEL KEYS =', sorted(ns.get('LEVELS', {}).keys()))
          ns['main']()
          PY
          echo '--- pwd ---'
          pwd
          echo '--- generated files anywhere nearby ---'
          find .. \( -name 'level_16.snbt' -o -name 'level_23.snbt' \) -print
          echo '--- git status ---'
          git status --short --untracked-files=all
