name: Apply 23-level progression

on:
  push:
    branches:
      - codex/levels-1-15-hayday-overhaul

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/levels-1-15-hayday-overhaul
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild progression
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path
          wrapper_path = Path('tools/restructure_progression_23.py').resolve()
          wrapper = wrapper_path.read_text(encoding='utf-8')
          payload = re.search(r'b64decode\(\"([^\"]+)\"\)', wrapper).group(1)
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          source = source.replace(
              '"icon": old_icons.get(level, LEVELS[level]["icon"]),',
              '"icon": old_icons[level] if level in old_icons else LEVELS[level]["icon"],'
          )
          ns = {'__name__': '__main__', '__file__': str(wrapper_path)}
          try:
              exec(compile(source, str(wrapper_path), 'exec'), ns)
          except SystemExit as exc:
              if exc.code not in (0, None):
                  raise
          PY
          python tools/format_quest_text.py --write
          test -f config/ftbquests/quests/chapters/level_16.snbt
          test -f config/ftbquests/quests/chapters/level_23.snbt
          git status --short --untracked-files=all
      - name: Commit migration output
        shell: bash
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "Lily"
            git config user.email "lily@users.noreply.github.com"
            git add config/ftbquests/quests/chapters
            git commit -m "feat: expand progression to 23 paced economic levels"
            git push origin HEAD:codex/levels-1-15-hayday-overhaul
          else
            echo "Progression output already matches the branch."
          fi
