name: Apply 23-level progression

on:
  push:
    branches:
      - codex/levels-1-15-hayday-overhaul

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/levels-1-15-hayday-overhaul
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild progression
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path
          wrapper = Path('tools/restructure_progression_23.py').read_text(encoding='utf-8')
          payload = re.search(r'b64decode\(\"([^\"]+)\"\)', wrapper).group(1)
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          source = source.replace(
              '"icon": old_icons.get(level, LEVELS[level]["icon"]),',
              '"icon": old_icons[level] if level in old_icons else LEVELS[level]["icon"],'
          )
          exec(compile(source, 'restructure_progression_23.py', 'exec'))
          PY
          python tools/format_quest_text.py --write
          git status --short
      - name: Commit migration output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Progression already generated."
            exit 0
          fi
          git config user.name "Lily"
          git config user.email "lily@users.noreply.github.com"
          git add config kubejs scripts tools PROGRESSION_DESIGN.md README.md changelog 2>/dev/null || true
          git commit -m "feat: expand progression to 23 paced economic levels"
          git push origin HEAD:codex/levels-1-15-hayday-overhaul
